services:
  - type: web
    name: django-porfolio
    runtime: python
    runtimeVersion: 3.11
    buildCommand: bash build.sh
    startCommand: gunicorn django_porfolio.wsgi:application --log-file -
    envVars:
      - key: DATABASE_URL
        scope: run
      - key: SECRET_KEY
        scope: run
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: CSRF_COOKIE_SECURE
        value: true
      - key: PYTHON_VERSION
        value: 3.10.5
